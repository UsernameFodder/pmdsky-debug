name: Check C Headers

on:
  pull_request:
    paths: 'headers/**'
    branches:
      - master
  workflow_call:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile
        run: make -C headers headers-aligned CFLAGS='-Wno-incompatible-library-redeclaration'
  implicit-padding-check:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile with implicit packing
        run: make -C headers headers-packed CFLAGS='-Wno-incompatible-library-redeclaration'
  compile-no-builtin:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile with no builtin function declarations
        run: make -C headers headers-no-builtin
  compile-unsized:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile with unsized types
        run: make -C headers headers-unsized
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Format check
        run: make -C headers format-check
  format:
    runs-on: ubuntu-latest
    needs: format-check
    if: ${{ failure() && github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For pull_request events, run the formatter on the exact PR head.
          # Without this, the formatted files for PRs from outdated branches
          # (that are still mergeable without conflict, otherwise the pull_request
          # event wouldn't even fire) would include any newer changes merged into the
          # target branch (i.e., master).
          #
          # This does mean that the format and format-check jobs might run on
          # different checkouts, which in rare cases could lead to surprising results
          # where the two disagree. In this case, the format-check job would still fail
          # after committing the formatted files. But this is actually what should
          # happen; if the PR in isolation is properly formatted but merging it breaks
          # formatting, then the solution should be to update the PR branch and
          # format the files in their merged state.
          #
          # The alternative would be for the format-check job to match the format job
          # by checking out the PR head. This is undesirable because the format-check
          # job is a correctness check, which should run on the final merged state.
          # This differs from the format job, which is just a convenience for
          # contributors.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Format
        run: make -C headers format
      - name: Package reformatted files
        run: zip clang-format-output.zip $(git diff --relative --name-only)
        working-directory: headers
      - name: Upload reformatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-headers
          path: headers/clang-format-output.zip
          retention-days: 1
      - name: Provide download link
        run: |
          echo 'Download link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts'
          echo "You can download these properly formatted header files if you don't have the formatter (clang-format) set up in your environment."
